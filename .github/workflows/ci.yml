name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate HTML & Links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate HTML
        uses: nicolomaioli/html5-validator-action@v1
        with:
          root: .

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --exclude-mail ./index.html
          fail: true

  lighthouse:
    name: Lighthouse Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Serve site and run Lighthouse
        run: |
          npx serve -l 8080 &
          sleep 3
          npx @lhci/cli autorun \
            --collect.url=http://localhost:8080 \
            --assert.preset=lighthouse:recommended \
            --assert.assertions.categories:performance=off
